[workspace]
name = "infra"
version = "0.1.0"
description = "Hackathon infrastructure - Ollama proxy"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64", "win-64"]

[dependencies]
python = "3.12.*"

[pypi-dependencies]
starlette = ">=0.40"
uvicorn = ">=0.30"
httpx = ">=0.27"

[tasks]
proxy = "python ollama_proxy.py"
