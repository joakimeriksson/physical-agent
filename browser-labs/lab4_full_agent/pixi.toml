[workspace]
name = "lab4_full_agent"
version = "0.1.0"
description = "Smart Home Agent - Python server + browser UI"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64", "win-64"]

[dependencies]
python = "3.12.*"

[pypi-dependencies]
starlette = ">=0.40"
uvicorn = ">=0.30"
httpx = ">=0.27"

[tasks]
server = "python server.py"
