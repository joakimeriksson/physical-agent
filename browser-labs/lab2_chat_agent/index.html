<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat Agent with Tools</title>
<style>
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --green: #4ade80;
    --yellow: #fbbf24;
    --red: #f87171;
    --tool-bg: #172554;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
  }

  h1 { font-size: 1.4rem; }
  .subtitle { color: var(--muted); font-size: 0.85rem; }

  .settings {
    display: flex;
    gap: 0.75rem;
    align-items: center;
    padding: 0.75rem 1.5rem;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    background: var(--surface);
  }

  .settings label { color: var(--muted); font-size: 0.8rem; }

  .settings input, .settings select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.35rem 0.5rem;
    border-radius: 5px;
    font-size: 0.8rem;
  }

  .settings input:focus, .settings select:focus {
    outline: none;
    border-color: var(--accent);
  }

  .main-content {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* Chat panel */
  .chat-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 1rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .message {
    max-width: 85%;
    padding: 0.75rem 1rem;
    border-radius: 10px;
    line-height: 1.5;
    font-size: 0.95rem;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .message.user {
    background: var(--accent);
    color: #000;
    align-self: flex-end;
    border-bottom-right-radius: 3px;
  }

  .message.assistant {
    background: var(--surface);
    border: 1px solid var(--border);
    align-self: flex-start;
    border-bottom-left-radius: 3px;
  }

  .message.tool-call {
    background: var(--tool-bg);
    border: 1px solid #1e40af;
    align-self: flex-start;
    font-family: monospace;
    font-size: 0.8rem;
    max-width: 90%;
  }

  .tool-label {
    color: var(--yellow);
    font-weight: 600;
    font-size: 0.75rem;
    margin-bottom: 0.3rem;
    text-transform: uppercase;
  }

  .message.thinking {
    background: var(--surface);
    border: 1px solid var(--border);
    align-self: flex-start;
    color: var(--muted);
    font-style: italic;
  }

  .spinner-inline {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 0.5rem;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Input area */
  .input-area {
    display: flex;
    gap: 0.5rem;
    padding: 1rem 1.5rem;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }

  .input-area input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.7rem 1rem;
    border-radius: 8px;
    font-size: 0.95rem;
  }

  .input-area input:focus { outline: none; border-color: var(--accent); }

  .input-area button {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 0.7rem 1.5rem;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
  }

  .input-area button:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Debug panel */
  .debug-panel {
    width: 350px;
    border-left: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    flex-direction: column;
  }

  .debug-header {
    padding: 0.75rem 1rem;
    font-weight: 600;
    font-size: 0.85rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .debug-toggle {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 0.2rem 0.5rem;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.75rem;
  }

  .debug-log {
    flex: 1;
    overflow-y: auto;
    padding: 0.75rem;
    font-family: monospace;
    font-size: 0.75rem;
    color: var(--muted);
  }

  .debug-entry {
    margin-bottom: 0.75rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--border);
  }

  .debug-entry pre {
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .debug-label {
    font-weight: 600;
    margin-bottom: 0.25rem;
  }

  .debug-label.request { color: var(--accent); }
  .debug-label.response { color: var(--green); }
  .debug-label.tool { color: var(--yellow); }

  @media (max-width: 900px) {
    .debug-panel { display: none; }
  }
</style>
</head>
<body>

<header>
  <h1>AI Chat Agent with Tools</h1>
  <p class="subtitle">Chat with an LLM that can call tools (calculator, time, dice)</p>
</header>

<div class="settings">
  <label for="ollama-url">Ollama URL:</label>
  <input type="text" id="ollama-url" value="https://ollama.botbox.se" size="28">
  <label for="api-key">API Key:</label>
  <input type="password" id="api-key" value="" size="20" placeholder="paste key here">
  <label for="model-select">Model:</label>
  <select id="model-select">
    <option value="qwen3:4b" selected>qwen3:4b</option>
    <option value="qwen3:14b">qwen3:14b (slower)</option>
    <option value="qwen2.5:7b">qwen2.5:7b</option>
  </select>
</div>

<div class="main-content">
  <div class="chat-panel">
    <div class="messages" id="messages">
      <div class="message assistant">Hello! I'm an AI assistant with tools. I can do calculations, tell you the time, or roll dice. Try asking me something!</div>
    </div>
    <div class="input-area">
      <input type="text" id="user-input" placeholder="Ask me something... (e.g. 'What is 42 * 17?')" autofocus>
      <button id="btn-send">Send</button>
    </div>
  </div>

  <div class="debug-panel" id="debug-panel">
    <div class="debug-header">
      Tool Call Debug
      <button class="debug-toggle" id="btn-clear-debug">Clear</button>
    </div>
    <div class="debug-log" id="debug-log"></div>
  </div>
</div>

<script>
// --- Tool definitions (sent to Ollama) ---

const TOOLS = [
  {
    type: "function",
    function: {
      name: "calculate",
      description: "Evaluate a mathematical expression. Supports +, -, *, /, **, sqrt, sin, cos, tan, log, pi, e.",
      parameters: {
        type: "object",
        properties: {
          expression: { type: "string", description: "The math expression to evaluate, e.g. '2 + 3 * 4'" }
        },
        required: ["expression"]
      }
    }
  },
  {
    type: "function",
    function: {
      name: "get_current_time",
      description: "Get the current date and time.",
      parameters: { type: "object", properties: {} }
    }
  },
  {
    type: "function",
    function: {
      name: "roll_dice",
      description: "Roll one or more dice. Specify number of dice and sides.",
      parameters: {
        type: "object",
        properties: {
          num_dice: { type: "integer", description: "Number of dice to roll (default 1)" },
          num_sides: { type: "integer", description: "Number of sides per die (default 6)" }
        }
      }
    }
  }
];

// --- Tool implementations (run locally in browser) ---

function executeTool(name, args) {
  switch (name) {
    case "calculate": {
      try {
        // Safe math eval: only allow numbers, operators, math functions
        const expr = args.expression || "";
        const safe = expr.replace(/[^0-9+\-*/().,%^ ]/g, (ch) => {
          const allowed = {"s":"s","i":"i","n":"n","c":"c","o":"o","t":"t","a":"a","q":"q","r":"r","l":"l","g":"g","p":"p","e":"e","M":"M","P":"P","E":"E","I":"I","S":"S"};
          return allowed[ch] || "";
        });
        const result = Function(
          '"use strict"; const pi=Math.PI,e=Math.E,sqrt=Math.sqrt,sin=Math.sin,cos=Math.cos,tan=Math.tan,log=Math.log,abs=Math.abs,pow=Math.pow; return (' + safe + ')'
        )();
        return JSON.stringify({ result: result });
      } catch (e) {
        return JSON.stringify({ error: "Invalid expression: " + e.message });
      }
    }
    case "get_current_time":
      return JSON.stringify({ time: new Date().toLocaleString(), timezone: Intl.DateTimeFormat().resolvedOptions().timeZone });
    case "roll_dice": {
      const n = args.num_dice || 1;
      const sides = args.num_sides || 6;
      const rolls = Array.from({length: n}, () => Math.floor(Math.random() * sides) + 1);
      return JSON.stringify({ rolls: rolls, total: rolls.reduce((a, b) => a + b, 0) });
    }
    default:
      return JSON.stringify({ error: "Unknown tool: " + name });
  }
}

// --- Chat state ---

let conversationHistory = [];
let isGenerating = false;

// --- DOM ---

const messagesEl = document.getElementById("messages");
const userInput = document.getElementById("user-input");
const btnSend = document.getElementById("btn-send");
const debugLog = document.getElementById("debug-log");

function addMessage(role, content, extraClass) {
  const div = document.createElement("div");
  div.className = `message ${extraClass || role}`;
  div.textContent = content;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function addToolCallMessage(toolName, args, result) {
  const div = document.createElement("div");
  div.className = "message tool-call";
  div.innerHTML = `<div class="tool-label">Tool: ${toolName}</div>` +
    `Args: ${JSON.stringify(args)}\nResult: ${result}`;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addDebugEntry(label, labelClass, content) {
  const div = document.createElement("div");
  div.className = "debug-entry";
  div.innerHTML = `<div class="debug-label ${labelClass}">${label}</div><pre>${
    typeof content === "string" ? content : JSON.stringify(content, null, 2)
  }</pre>`;
  debugLog.appendChild(div);
  debugLog.scrollTop = debugLog.scrollHeight;
}

// --- Ollama API ---

async function chatWithOllama(messages) {
  const ollamaUrl = document.getElementById("ollama-url").value.replace(/\/$/, "");
  const apiKey = document.getElementById("api-key").value;
  const model = document.getElementById("model-select").value;

  const payload = {
    model: model,
    messages: messages,
    tools: TOOLS,
    stream: false
  };

  addDebugEntry("Request", "request", payload);

  const headers = { "Content-Type": "application/json" };
  if (apiKey) headers["Authorization"] = `Bearer ${apiKey}`;

  const response = await fetch(`${ollamaUrl}/api/chat`, {
    method: "POST",
    headers: headers,
    body: JSON.stringify(payload)
  });

  if (!response.ok) {
    const text = await response.text();
    throw new Error(`Ollama returned ${response.status}: ${text}`);
  }

  const result = await response.json();
  addDebugEntry("Response", "response", result);
  return result;
}

// --- Main chat loop ---

async function sendMessage() {
  const text = userInput.value.trim();
  if (!text || isGenerating) return;

  isGenerating = true;
  btnSend.disabled = true;
  userInput.value = "";

  addMessage("user", text);
  conversationHistory.push({ role: "user", content: text });

  const thinkingEl = addMessage("assistant", "", "thinking");
  thinkingEl.innerHTML = '<span class="spinner-inline"></span>Thinking...';

  try {
    let result = await chatWithOllama(conversationHistory);
    thinkingEl.remove();

    // Handle tool call loop (LLM may call tools, then we feed results back)
    while (result.message && result.message.tool_calls && result.message.tool_calls.length > 0) {
      // Add assistant message with tool calls to history
      conversationHistory.push(result.message);

      // Execute each tool call
      for (const tc of result.message.tool_calls) {
        const toolName = tc.function.name;
        const toolArgs = tc.function.arguments || {};

        addDebugEntry(`Tool Call: ${toolName}`, "tool", toolArgs);

        const toolResult = executeTool(toolName, toolArgs);
        addToolCallMessage(toolName, toolArgs, toolResult);

        addDebugEntry(`Tool Result: ${toolName}`, "tool", toolResult);

        // Add tool result to conversation
        conversationHistory.push({ role: "tool", content: toolResult });
      }

      // Send back to LLM with tool results
      const thinkingEl2 = addMessage("assistant", "", "thinking");
      thinkingEl2.innerHTML = '<span class="spinner-inline"></span>Processing tool results...';

      result = await chatWithOllama(conversationHistory);
      thinkingEl2.remove();
    }

    // Final text response
    const content = result.message?.content || "(no response)";
    // Strip thinking tags from qwen3 models
    const cleaned = content.replace(/<think>[\s\S]*?<\/think>\s*/g, "").trim();
    addMessage("assistant", cleaned || content);
    conversationHistory.push({ role: "assistant", content: content });

  } catch (err) {
    thinkingEl.remove();
    addMessage("assistant", `Error: ${err.message}`);
  }

  isGenerating = false;
  btnSend.disabled = false;
  userInput.focus();
}

// --- Event listeners ---

btnSend.addEventListener("click", sendMessage);
userInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
document.getElementById("btn-clear-debug").addEventListener("click", () => {
  debugLog.innerHTML = "";
});

// Load defaults from shared config
fetch("../config.json").then(r => r.json()).then(c => {
  if (c.ollama_url) document.getElementById("ollama-url").value = c.ollama_url;
  if (c.ollama_api_key) document.getElementById("api-key").value = c.ollama_api_key;
  if (c.chat_model) document.getElementById("model-select").value = c.chat_model;
}).catch(() => {});
</script>
</body>
</html>
